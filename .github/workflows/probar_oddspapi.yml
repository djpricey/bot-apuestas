name: Probar OddsPapi
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m src.oddspapi
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      - name: Guardar catálogo y consumo
        run: |
          git config user.name "bot-apuestas"
          git config user.email "bot-apuestas@users.noreply.github.com"
          git add docs/data/oddspapi_cache.json docs/data/oddspapi_uso.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Catálogo de OddsPapi"
          git pull --rebase
          git push
